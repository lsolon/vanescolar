<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VanEscolar - sem internet</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  main{max-width:320px} h1{font-size:20px;color:#fbbf24;margin:0 0 8px} p{font-size:14px;line-height:1.5;color:#94a3b8}
  button{margin-top:16px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#fbbf24;color:#0f172a;font-weight:800;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Sem internet</h1>
  <p>O VanEscolar precisa de conexão para mostrar a posição da van e os dados da sua família. Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
